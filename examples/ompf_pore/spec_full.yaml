# =============================================================================
# ipro-agent example case -- PoreDesigner / OmpF  ::  FULL CAMPAIGN
# =============================================================================
#
#   *** THIS IS A CLUSTER-SCALE JOB. DO NOT START IT ON A LAPTOP. ***
#
#   25 design positions, 9 identities each (9^25 = 7.2e23 sequences), and a
#   Metropolis search in which every iteration costs a backbone perturbation,
#   a rotamer MILP, a rigid-body dock, a full Cartesian energy minimization and
#   a pore-geometry pass. The published termination condition -- 30 ACCEPTED
#   redesigns behind a hard "bottleneck below 4 A" filter that rejects most
#   proposals -- needs hundreds to low thousands of iterations to reach, and
#   the paper ran the whole thing FOUR TIMES, once per representative water
#   wire. Budget overnight-to-days of core time per wire, and expect to run
#   several seeds. It is embarrassingly parallel over wires and seeds.
#
#   Want to check the pipeline works first? Run `spec_smoke.yaml`, which is the
#   same problem cut down to 4 positions and 8 iterations, and which carries
#   the full annotated explanation of every key below.
#
#   Read `EXPECTED.md` BEFORE comparing any output of this run to the paper.
#   Several things in it are not reproducible even in principle: there are no
#   published per-design energies, no named solver, no named rotamer library,
#   no named design-stage force field and no random seed.
#
# SOURCE
#   Chowdhury et al., "PoreDesigner for tuning solute selectivity in a robust
#   and highly permeable outer membrane pore", Nat Commun 9:3661 (2018).
#   doi:10.1038/s41467-018-06097-1
# =============================================================================

name: ompf_pore_full

goal_statement: >
  Reproduce the PoreDesigner redesign of the OmpF porin monomer: shrink the
  eyelet from its wild-type 11 x 7 A down below 4 A, and line the constriction
  with long hydrophobic side chains so the permeating water wire makes as few
  hydrogen bonds with the pore wall as possible, mutating only the 25
  pore-constriction residues and only to the paper's nine allowed amino acids.

# Resolved by ipro_agent.goals, not validated by config.py. See the long note
# in spec_smoke.yaml: the paper's objective was really "weaken the interaction
# with the water wire", and its pore-size criterion was a separate hard filter.
# Without the wire (not shipped -- see below) only the geometric half of that
# is expressible here.
goal: reshape_channel

# -----------------------------------------------------------------------------
# molecules
# -----------------------------------------------------------------------------
# PoreDesigner designed the MONOMER. The biological OmpF trimer is generated by
# C3 crystallographic symmetry and was only patched together afterwards, with a
# VMD plugin, for the MD validation leg. Do not trimerize before designing.
molecules:
  - name: ompf
    path: 2omf_A.pdb          # prepared input; provenance is in its REMARKs
    kind: protein
    role: design
    chains: [A]
    redock: false

  # PoreDesigner's target molecule -- a single-file water wire from an AQP1 MD
  # trajectory -- is NOT shipped, because it was never deposited. Only its
  # fitted elliptical-helix parameters are published (Supplementary Table 1).
  # To add one you rebuild yourself, declare it as an ANTI-target, because the
  # objective must WEAKEN this interaction:
  #
  # - name: water_wire_1
  #   path: water_wire_1.pdb
  #   kind: ligand
  #   role: target             # role 'target'; `direction: narrow` below is
  #                            # what weakens this interaction, not the role
  #   redock: true
  #
  # The paper ran four such wires independently and kept the designs that were
  # convergent across all four. Reproducing that means four runs of this spec,
  # one per wire, not one run with four targets. Full explanation, and the
  # anisotropic-redocking limitation, in spec_smoke.yaml.

# -----------------------------------------------------------------------------
# positions -- all 25 pore-constriction residues
# -----------------------------------------------------------------------------
# PROVENANCE WARNING. These 25 residue numbers are DERIVED, not published. The
# paper says "the 25 pore constriction residues" and Supplementary Fig. 2b
# highlights them in a rendered image, but no residue number is printed
# anywhere in the paper, the Methods or the SI. The list below was recovered by
# diffing the published OCD-TFTrp sequence (Supplementary Fig. 6) against the
# wild type: that design is "the 25 pore constriction residues mutated to only
# Trp", so its 25 substitutions ARE the design-position set. The derivation was
# re-run independently against this repo's prepared 2omf_A.pdb and reproduced
# exactly, and the native identity of all 25 was confirmed against the
# structure. Numbering is mature OmpF 1-340 = 2OMF chain A, with no offset.
#
# Structurally the set splits in two:
#   barrel wall / upper constriction face : 18 20 38 40 42 62 64 82 83
#   loop L3, which forms the eyelet       : 109 110 113 114 115 117 118 119
#                                           120 121 123 124 125 130 131 132
#
# The alphabet is the paper's nine, identical at every position:
#   LONG  = TRP PHE TYR MET        SHORT = ILE LEU VAL PRO ALA
# Do not substitute the `hydrophobic` group for it -- that group contains GLY
# and omits TYR, so it is a different design space. The native identity is
# shown after each entry; where it is already in the alphabet, "stay wild type"
# is a legal answer, faithful to MILP constraints 6 and 9.
positions:
  # --- barrel wall / upper constriction face --------------------------------
  - {position: "A18",  allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # VAL
  - {position: "A20",  allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # LEU
  - {position: "A38",  allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # MET
  - {position: "A40",  allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # TYR
  - {position: "A42",  allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # ARG *
  - {position: "A62",  allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # GLU *
  - {position: "A64",  allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # ASN
  - {position: "A82",  allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # ARG *
  - {position: "A83",  allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # LEU
  # --- loop L3 (the eyelet-forming internal loop) ---------------------------
  - {position: "A109", allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # LEU
  - {position: "A110", allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # GLY
  - {position: "A113", allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # ASP *
  - {position: "A114", allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # MET
  - {position: "A115", allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # LEU
  - {position: "A117", allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # GLU *
  - {position: "A118", allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # PHE
  - {position: "A119", allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # GLY
  - {position: "A120", allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # GLY
  - {position: "A121", allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # ASP *
  - {position: "A123", allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # ALA
  - {position: "A124", allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # TYR
  - {position: "A125", allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # SER
  - {position: "A130", allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # VAL
  - {position: "A131", allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # GLY
  - {position: "A132", allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # ARG *
  #
  # * = R42, E62, R82, D113, E117, D121, R132 are the canonical OmpF
  #     constriction charge cluster. That this derived set contains exactly
  #     those residues is the independent check that the numbering is right.
  #
  # --- the 26th position: an unresolved discrepancy -------------------------
  # Both experimentally tested non-Trp-only designs carry one further mutation
  # at Y310 (Y310W in CSD, Y310G in UCD) which is OUTSIDE the 25-position
  # OCD-TFTrp set. Y310 is a known OmpF pore-lining residue, so either the
  # general runs used a 26th design position, or the published "25" counts only
  # the residues highlighted in Supplementary Fig. 2b. The union of all
  # positions mutated across the three tested designs is 26, not 25.
  #
  # This spec runs the 25, as published. To test the alternative, uncomment:
  # - {position: "A310", allowed: [TRP, PHE, TYR, MET, ILE, LEU, VAL, PRO, ALA]}  # TYR
  # and say in your write-up which of the two you ran -- they are different
  # design problems and cannot both be "the paper's".
  #
  # --- variant: the deterministic OCD-TFTrp control ------------------------
  # Replace every `allowed` list above with `[TRP]` and you have the paper's
  # "total fill" control: the amino-acid choice collapses, the composition
  # constraint becomes trivially satisfied, and the MILP degenerates to pure
  # rotamer packing of 25 tryptophans. That variant has an exactly published,
  # 25-mutation expected answer and is independent of the stochastic search,
  # which makes it by far the strongest regression target in this example.
  # (The paper's twin OCD-TFPhe control, `[PHE]`, has no published sequence.)

# -----------------------------------------------------------------------------
# loop
# -----------------------------------------------------------------------------
# [paper] = PoreDesigner's own published value.  [ours] = a choice this spec
# makes because the paper does not state one. That distinction is the whole
# content of the reproducibility discussion in EXPECTED.md -- keep it visible.
loop:
  # The published termination condition is the ACCEPTED-design count, not an
  # iteration count: "until a pre-specified number of accepted redesigns in
  # terms of pore size are retrieved (i.e., typically we require 30 accepted
  # redesigns)" (SI step 8). 30 is therefore [paper].
  stop_after_accepted: 30

  # The iteration CAP is [ours]. The paper publishes no iteration count at all.
  # 3000 is sized from the acceptance rate you should expect behind a hard
  # sub-4 A filter; raise it if the run ends on the cap rather than on the
  # accepted count, and SAY SO when you report, because a run that hit the cap
  # did not meet the published termination condition.
  iterations: 3000

  design_per_iteration: [1, 3]  # [IPRO] stock IPRO redesigns 1-3 contiguous
                                #        positions per iteration, not all 25.
                                #        The paper instead draws a random cap M
                                #        on mutations per iteration from an
                                #        unspecified distribution (MILP
                                #        constraint 5) -- an irreducible
                                #        reproducibility hole; this is the
                                #        nearest available knob.
  perturbation_flank: 5         # NOT IMPLEMENTED (kept so old specs load):
                                # the flanking window is not repacked -- DESIGN.md 4
  perturbation_sigma_deg: 1.5   # [paper] phi/psi ~ N(0, 1.5 deg)
  perturbation_cap_deg: 5.0     # [ours]  truncation; IPRO's default

  neighbour_cutoff: 4.5         # NOT IMPLEMENTED: nothing repacks within 4.5 A
  energy_cutoff: 12.0           # [IPRO]  non-bonded cutoff, A

  temperature_k: 3640.0         # [paper] Metropolis temperature
  integer_cuts: true            # [paper] the SI's cumulative CUTS set

  ensemble_size: 30             # [ours] keep all 30 accepted designs, because
                                #        the published result is a POPULATION
                                #        (40 sub-4 A designs: 2 OCD, 31 UCD,
                                #        7 CSD), not a single best sequence.
  keep_structures: true         # [ours] required: you cannot classify a design
                                #        as OCD/UCD/CSD, or measure its pore,
                                #        from a sequence alone. Costs disk;
                                #        output goes to runs/ (git-ignored).
  random_seed: 0                # [ours] the paper publishes NO seed. Vary it
                                #        across replicate runs and report the
                                #        spread, not one lucky run.
  max_minutes: null             # [ours] no wall-clock cap; use your scheduler's

# Redocking (redock_every, redock_moves, redock_sigma_angstrom,
# redock_sigma_deg) is inert here: nothing in this spec has `redock: true`,
# because the water wire is not shipped.

# -----------------------------------------------------------------------------
# backends
# -----------------------------------------------------------------------------
# Left on `auto`, which resolves at run time and falls back to the built-ins.
# For a campaign this size you should pin them deliberately and record what you
# pinned: `python scripts/doctor.py` reports what resolved. None of these is the
# paper's software -- PoreDesigner named no MILP solver, no rotamer library and
# no design-stage force field -- so there is nothing here to match, and no
# published energy to match it against.
backends:
  energy: auto
  mutate: auto
  dock: auto
  milp_solver: auto

# -----------------------------------------------------------------------------
# goal_options -- read by the goal implementation, NOT validated by config.py
# -----------------------------------------------------------------------------
goal_options:

  # --- keys this implementation actually reads -------------------------------
  # `reshape_channel` (ipro_agent/goals.py) reads `direction`, `long_fraction`,
  # `long_residues`, `target_radius` and `radius_weight`. The names below were
  # written against the paper's vocabulary; these are the equivalents in this
  # tool. PoreDesigner narrowed the pore, so direction is "narrow", which is
  # also what makes the >=50% long-residue constraint fire automatically.
  direction: narrow
  long_fraction: 0.5

  # Aim for a ~4 A bottleneck (radius 2 A). With all 25 positions the geometric
  # term does respond to the design, because these positions ring the lumen.
  # Measured with `ipro-agent score` on this spec: starting bottleneck 6.24 A
  # (radius 3.121), radius score 1.257. That starting point is NOT the wild
  # type: the 9-residue alphabet below excludes the native residue at 13 of
  # these 25 positions, so scoring substitutes the best allowed rotamer there
  # (8 of them tryptophan) and the run says so in a note. The deposited
  # wild-type eyelet is 8.07 A. (Earlier comments here quoted 1.102 -> 0.678
  # and 6.41 -> 5.65 A for a 4-iteration run; those are withdrawn -- see
  # docs/DESIGN.md 7d.) Budget about 85 s/iteration at this size
  # (25 positions x 9 residues).
  target_radius: 2.0

  # LIVE since the pore-geometry measurement landed: `pore_diameter_min` /
  # `pore_diameter_max` below are the paper's hard acceptance filter -- a design
  # whose bottleneck falls outside the window is discarded before its energy is
  # considered. `target_radius` additionally puts the radius in the objective.
  #
  # The axis is fitted as the normal to the plane of the design positions, which
  # line the constriction; on this structure that measures the wild-type eyelet
  # at 8.07 A against the published 11 x 7 A (an inscribed circle is bounded by
  # the narrow direction, so ~7 A is the comparison). See docs/DESIGN.md 1h.
  # That fit is only meaningful because these 25 positions SURROUND the lumen:
  # the axis origin clears the nearest van der Waals surface by 2.80 A in the
  # input structure, where a water needs 1.40 A. The 4-position smoke spec
  # clears 0.30 A and its "bottleneck" is a gap beside a wall.
  # Acceptance filter, SI section 3 step 3 "Check 1": keep a redesign only if
  # the pore bottleneck is below 4 A. Applied BEFORE the interaction energy is
  # computed, so most proposals die here -- this is what sets the run length.
  pore_diameter_max: 4.0
  pore_diameter_min: null
  #
  # For the paper's second campaign (17 further designs spanning 4-10 A in 1 A
  # bins) set both bounds instead, e.g. pore_diameter_min: 5.0 and
  # pore_diameter_max: 6.0, which is the worked example given in the text.

  # MILP constraint 4: at least half the design positions take a LONG side
  # chain. In this tool's MILP (ipro_agent/milp.py):
  #     Constraint(kind="min_class", fraction=0.5,
  #                residues=["TRP", "PHE", "TYR", "MET"],
  #                label="PoreDesigner >=50% long side chains")
  # With 25 positions, `fraction: 0.5` rounds up to at least 13 LONG.
  #
  # The SI's own two statements of this constraint disagree about MET: the prose
  # says "Trp, Phe or Tyr", formal constraint 4 counts Met as long. Constraint 4
  # is implemented here. The paper also warns how this knob misbehaves at the
  # extremes -- too low and the run stalls generating small-side-chain designs
  # that fail the size filter; too high and the bulky residues clash and give
  # pores LARGER than intended, "akin to OCD-TFTrp".
  # `long_fraction` is set at the top of this block -- it is the live key, and
  # the only one that fires the constraint. (Two keys that were written here,
  # `min_long_fraction` and `short_residues`, were read nowhere in the package:
  # the first looked like the knob doing the work while `long_fraction` above
  # was in fact doing it, and the second named a set nothing consulted. Unknown
  # goal_options keys are now refused rather than ignored, which is what
  # surfaced them.)
  long_residues: [TRP, PHE, TYR, MET]

notes: >
  Cluster-scale. The published result is a population of 40 sub-4 A designs
  (2 OCD, 31 UCD, 7 CSD) of which three were expressed and tested, not a single
  sequence -- so judge a run by its ensemble, and read EXPECTED.md for which
  comparisons against the paper are meaningful and which are not available at
  all. The 25 design positions are derived, not published; the Y310 question is
  open; and there are no published per-design energies to check against.
