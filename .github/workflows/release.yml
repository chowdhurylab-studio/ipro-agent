# Publish a release, with no token on anyone's laptop.
#
# Both publications authenticate by OIDC: PyPI through Trusted Publishing and
# the MCP Registry through `mcp-publisher login github-oidc`. Nothing here
# reads a secret, so there is no token to create, store, paste or leak, and the
# release is reproducible from a tag rather than from whoever happened to run
# twine.
#
# One-time setup, in the PyPI web UI (Your projects -> Publishing, or
# https://pypi.org/manage/account/publishing/ for a project that does not exist
# yet):
#
#     PyPI project name   ipro-agent
#     Owner               chowdhurylab-studio
#     Repository name     ipro-agent
#     Workflow name       release.yml
#     Environment name    pypi
#
# Then release by tagging:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the version in pyproject.toml and in both places in
# server.json; the first job refuses otherwise rather than publishing a
# mislabelled release.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: the tag, pyproject and server.json must agree
        run: |
          python3 - <<'PY'
          import json, os, re, pathlib, sys

          ref = os.environ.get("GITHUB_REF", "")
          tag = ref.rsplit("/", 1)[-1] if ref.startswith("refs/tags/") else ""
          py = re.search(r'^version = "([^"]+)"',
                         pathlib.Path("pyproject.toml").read_text(), re.M).group(1)
          sj = json.loads(pathlib.Path("server.json").read_text())

          print(f"tag={tag!r} pyproject={py!r} server.json={sj['version']!r} "
                f"package={sj['packages'][0]['version']!r}")
          bad = []
          if sj["version"] != py:
              bad.append("server.json version != pyproject version")
          if sj["packages"][0]["version"] != py:
              bad.append("server.json packages[0].version != pyproject version")
          if tag and tag.lstrip("v") != py:
              bad.append(f"tag {tag} != pyproject version {py}")
          if bad:
              sys.exit("version mismatch:\n  " + "\n  ".join(bad))
          print("versions agree")
          PY

      - name: the registry's ownership marker must survive into the description
        run: |
          grep -q "mcp-name: io.github.chowdhurylab-studio/ipro-agent" README.md
          echo "ownership marker present"

  pypi:
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # Trusted Publishing; no token, no secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: the wheel must carry what an installed copy needs
        run: |
          python3 - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          need = [
              "ipro_agent/doctor.py",
              "ipro_agent/mcp_server.py",
              "ipro_agent/pymol_helpers/harvest_rotamers.py",
              "ipro_agent/pymol_helpers/apply_design.py",
          ]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit(f"{whl} is missing {missing}")
          print(f"{whl}: all required files present")
          PY

      - uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # proves the io.github.chowdhurylab-studio namespace
    steps:
      - uses: actions/checkout@v4

      - name: install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.10
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --help | head -3

      - name: validate against the live registry
        run: mcp-publisher validate

      - name: publish
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
